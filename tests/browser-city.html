<!doctype html><html lang="nl"><meta charset="utf-8"><title>Sterrenstad testvoorbereiding</title><body>
<h1>Lokale browsertest</h1><p>Gebruik alleen op de aparte test-origin localhost:8000. Deze knoppen zetten testvoortgang klaar.</p>
<button id="starter">Test met 240 sterren en startwoning</button>
<button id="town">Test met gevulde stad</button>
<button id="zero">Test met nul sterren</button>
<script src="../city-model.js"></script>
<script>
function prepare(mode) {
  if(location.hostname !== 'localhost') { document.querySelector('p').textContent='Open deze test op localhost, niet op de preview-origin.'; return; }
  const M=StarCityModel; let city=M.initial();
  if(mode==='town') {
    let i=0;
    for(let radius=1;radius<4;radius++)for(let x=1;x<6;x++)for(let y=1;y<6;y++) {
      if(Math.abs(x-3)+Math.abs(y-3)!==radius)continue;
      const r=M.apply(city,10000,{kind:'buy',type:M.catalog[i++%8].id,x,y});if(!r.error)city=r.city;
    }
  }
  localStorage.setItem('sterrenrekenen-v1',JSON.stringify({stars:mode==='zero'?0:240,correctMultiply:300,correctSubtract:10,totalAttempts:320,practicedTables:[2,3,4],sound:false,lastGameIds:[],city}));
  location.href='../index.html';
}
document.querySelector('#starter').onclick=()=>prepare('starter');document.querySelector('#town').onclick=()=>prepare('town');document.querySelector('#zero').onclick=()=>prepare('zero');
</script></body></html>
